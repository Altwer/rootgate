# Builds rootgate and publishes a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0   -> tests, builds, creates release v0.1.0
#   Actions tab -> Release -> Run workflow     -> tests and builds only (files under the run's Artifacts)
#
# APK signing (optional): add these repository secrets to get a signed, installable APK.
#   ANDROID_KEYSTORE_B64       base64 of your release keystore (base64 -w0 ~/rootgate-release.jks)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          key alias (default: rootgate)
# Without them the release gets an unsigned APK, which you sign locally and upload yourself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.arch }}-unknown-linux-musl

      - name: Protocol tests
        run: cargo test --lib "proto::"

      # musl: fully static binaries that run on any Linux distribution.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl

      - name: Package
        run: |
          name="rootgate-${GITHUB_REF_NAME//\//-}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.arch }}-unknown-linux-musl/release"
          strip "$bin/rootgated" "$bin/ask-root"
          cp "$bin/rootgated" "$bin/ask-root" install.sh rootgated.service \
             rootgate.env.example README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # The Android tests write a Java-made signature; the daemon must accept it.
      - name: Cross-check Java signature in Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --test cross_verify -- --ignored

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p dist
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          version="${GITHUB_REF_NAME//\//-}"
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::No signing secrets set: publishing an unsigned APK."
            cp "$unsigned" "dist/rootgate-$version-unsigned.apk"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$keystore"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "${KEY_ALIAS:-rootgate}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "dist/rootgate-$version.apk" "$unsigned"
          rm -f "$keystore"
          echo "Signing certificate (users can compare this after installing):"
          "$apksigner" verify --print-certs "dist/rootgate-$version.apk" | grep -i sha-256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rootgate $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Linux: download the archive for your CPU, fill in rootgate.env, run sudo ./install.sh. Android: install the APK. Check files against SHA256SUMS."
